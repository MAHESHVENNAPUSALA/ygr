{% extends "admin_base.html" %}

{% block title %}{{ title }}{% endblock %}
{% block header_title %}{{ title }}{% endblock %}

{% block content %}

<style>
/* ===== FORM CONTAINER ===== */
.form-container {
    background: #ffffff;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 25px 45px rgba(0,0,0,0.08);
    max-width: 700px;
    margin: auto;
}

/* ===== FORM TITLE ===== */
.form-container h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 26px;
    color: #092a49;
}

/* ===== FORM GROUP ===== */
.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #444;
}

/* ===== INPUTS ===== */
.form-group input[type="text"],
.form-group input[type="file"],
.form-group textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #dcdcdc;
    font-size: 14px;
    transition: all 0.3s ease;
}

.form-group textarea {
    min-height: 150px;
    resize: vertical;
}

/* ===== FOCUS ===== */
.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #007bff;
    box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.15);
}

/* ===== SUBMIT BUTTON ===== */
.submit-btn {
    width: 100%;
    padding: 12px;
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}

.submit-btn:hover {
    background-color: #0056b3;
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,123,255,0.35);
}

/* ===== BACK LINK ===== */
.back-link {
    display: inline-block;
    margin-top: 12px;
    color: #007bff;
    font-weight: 600;
    text-decoration: none;
}

.back-link:hover {
    color: #0056b3;
}

/* ===== MOBILE ===== */
@media (max-width: 600px) {
    .form-container {
        padding: 20px;
    }

    .form-container h2 {
        font-size: 22px;
    }

    .form-group input[type="text"],
    .form-group input[type="file"],
    .form-group textarea {
        font-size: 14px;
        padding: 10px;
    }

    .submit-btn {
        padding: 11px;
        font-size: 14px;
    }
}
</style>

<div class="form-container">
    <h2>{{ title }}</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label>Blog Title</label>
            {{ form.title }}
        </div>

        <div class="form-group">
            <label>Featured Image</label>
            {{ form.image }}
        </div>

        <div class="form-group">
            <label>Blog Description</label>
            {{ form.description }}
        </div>

        <button type="submit" class="submit-btn">
            Save Blog
        </button>
        <a href="{% url 'admin_blog_list' %}" class="back-link">
            ⬅ Back
        </a>
    </form>
</div>

{% endblock %}
