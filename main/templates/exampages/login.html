{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Meta Title -->
  <title>Login | Internship Portal KPHB Hyderabad</title>
  
  <!-- Meta Keywords -->
  <meta name="keywords" content="Internship Login, KPHB Internships, Student Portal, IT Internships KPHB, Login for Training">
  
  <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}"/>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      max-width: 100%;
      overflow-x: hidden;
      padding: 0;
    }

    .form-container {
      background-color: #fff;
      padding: 25px 20px;
      border-radius: 10px;
      max-width: 350px;
      margin: 50px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .form-container img.logo1 {
      width: 80px;
      margin-bottom: 15px;
    }

    h2 {
      margin-bottom: 20px;
      color: #092A49;
      font-size: 22px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 14px;
    }

    input[type="submit"] {
      background-color: #092A49;
      color: #fff;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    input[type="submit"]:hover {
      background-color: #06426b;
    }

    .error {
      color: red;
      font-size: 13px;
      margin-bottom: 10px;
      text-align: left;
    }

    .form-container p{
      font-size: 18px;
      margin-top: 20px;
    }

   .form-container p a {
      color: #092A49;
      text-decoration: none;
      font-weight: bold;
    }
.form-container p a:hover{
    color: #0796fe;
}
 
    @media (max-width: 400px) {
      .form-container {
        margin: 20px 10px;
        padding: 20px 15px;
      }

      h2 {
        font-size: 20px;
      }

      input[type="submit"] {
        font-size: 15px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
{% include 'header.html' %}

<div class="form-container">
  <img src="{% static 'images/logo.png' %}" alt="logo" class="logo1">
  <h2>Intern Login</h2>

  {% if messages %}
    {% for message in messages %}
      <div class="error">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <input type="text" name="identifier" placeholder="Username or Email" required>
    <input type="password" name="roll_no" placeholder="Roll Number" required>
    <input type="submit" value="Login">
  </form>

  <p>Not registered? <a href="{% url 'internships_list' %}">Register</a></p>
</div>

{% include 'footer.html' %}
</body>
</html>
