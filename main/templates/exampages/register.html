{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Internship Registration in KPHB Hyderabad | Pay & Register Online</title>
  <meta name="keywords" content="Internship Registration, IT Internships KPHB, Software Training, Online Internship Payment, IT Courses Hyderabad">
  
  <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}"/>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    /* Reset & body */
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      max-width: 100%;
      overflow-x: hidden;
      padding: 10px;
    }

    /* Container */
    .form-container {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      margin: 20px auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* Logo */
    .logo1 {
      display: block;
      margin: 0 auto 15px;
      width: 100px;
      height: auto;
    }

    h3 {
      text-align: center;
      color: #092a49;
      margin-bottom: 15px;
      font-size: 20px;
    }

    p {
      font-size: 14px;
      margin-bottom: 15px;
    }

    /* Form */
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    .required {
      color: red;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="file"] {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 100%;
      font-size: 14px;
      box-sizing: border-box;
    }

    button,
    input[type="submit"] {
      background-color: #092a49;
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover,
    input[type="submit"]:hover {
      background-color: #06426b;
    }

    /* Already registered */
    .already-registered {
      text-align: center;
      margin-top: 15px;
      font-size: 18px;
      color: #555;
    }

    .already-registered a {
      color: #092a49;
      text-decoration: none;
      font-weight: bold;
    }

   

    .error {
      color: red;
      font-size: 12px;
      margin-bottom: 5px;
    }

    /* Responsive adjustments */
    @media (max-width: 420px) {
      .form-container {
        padding: 15px;
        margin: 0px 10px;
        margin-bottom: 60px;
      }

      .form-container h2{
        font-size: 18px;
      }

      button,
      input[type="submit"] {
        font-size: 15px;
        padding: 10px;
      }
    }
   
  </style>
</head>

<body>
{% include 'header.html' %}

<div class="form-container">
  <img src="{% static 'images/logo.png' %}" alt="logo" class="logo1" />
  <h3>Register for Internship</h3>
  <p><strong>Selected Course:</strong> {{ course.title }}</p>

  <form id="registerForm" method="POST" enctype="multipart/form-data" onsubmit="startPayment(); return false;">
    {% csrf_token %}

    <label>Name <span class="required">*</span></label>
    <input type="text" name="name" required />
    <div class="error" id="error-name"></div>

    <label>Email <span class="required">*</span></label>
    <input type="email" name="email" required />
    <div class="error" id="error-email"></div>

    <label>Phone <span class="required">*</span></label>
    <input type="number" name="phone" required />
    <div class="error" id="error-phone"></div>

    <label>WhatsApp Number</label>
    <input type="number" name="wphone" />

    <label>College Name <span class="required">*</span></label>
    <input type="text" name="clg_name" required />

    <label>College Address</label>
    <input type="text" name="clg_address" />

    <label>Roll Number <span class="required">*</span></label>
    <input type="text" name="roll_no" required />

    <label>Branch</label>
    <input type="text" name="branch" required />

    <label>Upload Photo</label>
    <input type="file" name="photo" accept="image/*" />

    <label>Upload Resume <span class="required">*</span></label>
    <input type="file" name="resume" required />

    <button type="submit">Pay ₹299.00 & Register</button>
  </form>

  <div class="already-registered">
    Already registered? <a href="{% url 'login' %}">Login</a>
  </div>
</div>

{% include 'footer.html' %}

<script>
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  function startPayment() {
    const form = document.getElementById("registerForm");
    const formData = new FormData(form);
    const courseId = {{ course.id }};

    document.querySelectorAll(".error").forEach(e => e.textContent = "");

    fetch(`/register/${courseId}/`, {
      method: "POST",
      body: formData,
      headers: {"X-CSRFToken": getCookie("csrftoken")}
    })
    .then(res => res.json().then(data => ({status: res.status, body: data})))
    .then(res => {
      if (res.status === 400 && res.body.errors) {
        for (const field in res.body.errors) {
          const errorDiv = document.getElementById(`error-${field}`);
          if (errorDiv) errorDiv.textContent = res.body.errors[field];
        }
      } else if (res.body.status === "registered") {
        fetch("/api/create-order/", {
          method: "POST",
          headers: {"X-CSRFToken": getCookie("csrftoken")}
        })
        .then(r => r.json())
        .then(order => {
          const options = {
            key: order.key,
            amount: order.amount,
            currency: "INR",
            order_id: order.order_id,
            name: "Internship Registration",
            prefill: {
              name: formData.get("name"),
              email: formData.get("email"),
              contact: formData.get("phone")
            },
            handler: function(response) {
              fetch("/api/verify-payment/", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
                body: JSON.stringify(response)
              })
              .then(r => r.json())
              .then(result => {
                if (result.status === "success") {
                  alert("Payment Successful!");
                  window.location.href = "/payment-success/";
                } else {
                  alert("Payment verification failed");
                }
              });
            },
            modal: {
              ondismiss: function() {
                fetch("/api/delete-pending-user/", { method: "POST", headers: {"X-CSRFToken": getCookie("csrftoken")} });
                alert("Payment cancelled. Registration removed.");
              }
            }
          };
          new Razorpay(options).open();
        });
      }
    })
    .catch(err => {
      console.error(err);
      alert("Something went wrong. Please try again!");
    });
  }
</script>

</body>
</html>
