<!DOCTYPE html>
<html lang="en">
<head>
      <link rel="icon" type="image/png" href="/static/images/logo.png"/>
<meta charset="UTF-8">
<title>Exam Submitted</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        background: white;
        padding: 50px 80px;
        border-radius: 15px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        text-align: center;
        max-width: 500px;
        width: 90%;
        animation: fadeIn 1s ease-in-out;
    }

    h1 {
        color: #28a745;
        font-size: 36px;
        margin-bottom: 20px;
    }

    p {
        font-size: 22px;
        margin-bottom: 40px;
        color: #333;
    }

    a {
        display: inline-block;
        text-decoration: none;
        background: #007bff;
        color: white;
        padding: 12px 30px;
        font-size: 18px;
        border-radius: 8px;
        transition: background 0.3s, transform 0.3s;
    }

    a:hover {
        background: #0056b3;
        transform: scale(1.05);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>
    <div class="container">
        <h1>Exam Submitted Successfully!</h1>
        <p>Your Score: <strong>{{ score }}/60</strong></p>
        <a href="{% url 'home' %}">Go to Home</a>
    </div>
</body>
</html>
