<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
      <link rel="icon" type="image/png" href="/static/images/logo.png"/>
    <title>User Data</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #444;
            padding: 8px;
            text-align: center;
        }
        img {
            width: 80px;
        }

        /* Button */
        .btn {
            padding: 6px 12px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
        }

        .modal-content {
            background: white;
            width: 70%;
            height: 80%;
            margin: 5% auto;
            padding: 10px;
            position: relative;
        }

        .close {
            position: absolute;
            right: 10px;
            top: 5px;
            font-size: 25px;
            cursor: pointer;
        }

        iframe {
            width: 100%;
            height: 95%;
            border: none;
        }
    </style>
</head>

<body>

<h2>User Data</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <!-- <th>Whatsapp</th> -->
        <th>College</th>
        <!-- <th>Address</th> -->
        <th>Roll No</th>
        <th>Branch</th>
        <!-- <th>Photo</th> -->
        <th>Resume</th>
    </tr>

    {% for i in users %}
    <tr>
        <td>{{ i.id }}</td>
        <td>{{ i.username }}</td>
        <td>{{ i.email }}</td>
        <td>{{ i.phone }}</td>
        <!-- <td>{{ i.wnumber }}</td> -->
        <td>{{ i.clg_name }}</td>
        <!-- <td>{{ i.clg_address }}</td> -->
        <td>{{ i.roll_no }}</td>
        <td>{{ i.branch }}</td>

         
    </tr>
    {% endfor %}
</table>

<!-- Modal -->
<div id="resumeModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeResume()">&times;</span>
        <iframe id="resumeFrame"></iframe>
    </div>
</div>

<script>
    function openResume(url) {
        document.getElementById("resumeFrame").src = url;
        document.getElementById("resumeModal").style.display = "block";
    }

    function closeResume() {
        document.getElementById("resumeModal").style.display = "none";
        document.getElementById("resumeFrame").src = "";
    }
</script>

</body>
</html>
