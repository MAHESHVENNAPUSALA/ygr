<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RR Group Growth Tree</title>

<style>
:root {
    --trunk: #5a3e1b;
    --y2023: #ff6b6b;  /* nicer red */
    --y2024: #4ecdc4;  /* teal */
    --y2025: #ffa502;  /* orange */
    --y2026: #6c5ce7;  /* purple */
    --bg: #f4f6f8;
    --white: #ffffff;
}

body {
    background: var(--bg);
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    text-align: center; /* h1 centered */
}

h1 {
    margin: 25px 0 15px;
    font-size: 28px;
    color: #1f2933;
}

/* Content Panel */
#yearContent {
    max-width: 850px;
    margin: 10px auto 20px; /* smaller top margin to tree */
    padding: 15px;
    background: #fff;
    border-radius: 14px;
    display: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
    animation: fade .3s ease;
    text-align: left; /* content aligned left */
    overflow: auto; /* content can scroll if too big */
    max-height: 200px; /* limit height */
}

#yearContent h3 {
    text-align: center;
    margin-bottom: 8px;
}

#yearContent p {
    line-height: 1.6;
    color: #333;
    margin: 0;
}

/* Wrapper */
.wrapper {
    max-width: 1100px;
    margin: auto;
}

/* Branch animation */
.branch {
    fill: none;
    stroke: var(--trunk);
    stroke-width: 9;
    stroke-linecap: round;
    stroke-dasharray: 500;
    stroke-dashoffset: 500;
    animation: grow 1.2s ease forwards;
}

/* Nodes / Leaves */
.node circle {
    cursor: pointer;
    transform-origin: center;
    transform: scale(0);
    animation: circleIn 0.6s ease forwards;
    transition: transform .25s ease;
}

.node circle:hover {
    transform: scale(1.2); /* slightly bigger on hover */
}

/* Node Text */
.node text {
    pointer-events:none;
    fill: var(--white);
    font-size: 12px;
    font-weight: bold;
    text-anchor: middle;
    opacity: 0;
    animation: textIn 0.5s ease forwards;
}

.node .sub {
    font-size: 10px;
    font-weight: normal;
}

@keyframes fade {
    from {opacity:0; transform:translateY(5px);}
    to {opacity:1; transform:translateY(0);}
}

@keyframes grow {
    to { stroke-dashoffset: 0; }
}

@keyframes circleIn {
    to { transform: scale(1); }
}

@keyframes textIn {
    to { opacity: 1; }
}

/* Responsive */
@media(max-width:768px){
    svg{
        height: 520px;
    }
    #yearContent{
        margin:10px;
        max-height: 180px;
    }
}
</style>
</head>

<body>

<h1>RR Group – Growth Tree</h1>

<div class="wrapper">
    
<!-- Dynamic Content Area -->
<div id="yearContent"></div>
<svg viewBox="0 0 900 650" width="100%" height="800px">

    <!-- Trunk -->
    <path d="M450 560 L450 300" class="branch" style="animation-delay:0s"/>

    <!-- Branches -->
    <path d="M450 360 C300 280, 200 240, 150 220" class="branch" style="animation-delay:0.6s"/>
    <path d="M450 320 C320 290, 260 300, 220 320" class="branch" style="animation-delay:1.2s"/>
    <path d="M450 320 C580 290, 640 300, 680 320" class="branch" style="animation-delay:1.8s"/>
    <path d="M450 360 C600 280, 700 240, 750 220" class="branch" style="animation-delay:2.4s"/>

    <!-- 2023 -->
    <g class="node" onclick="showYear(2023)">
        <circle cx="150" cy="220" r="36" fill="var(--y2023)" style="animation-delay:1.2s"/>
        <text x="150" y="214" style="animation-delay:1.8s">2023</text>
        <text x="150" y="230" class="sub" style="animation-delay:1.8s">RR Global</text>
    </g>

    <!-- 2024 -->
    <g class="node" onclick="showYear(2024)">
        <circle cx="220" cy="320" r="36" fill="var(--y2024)" style="animation-delay:1.8s"/>
        <text x="220" y="314" style="animation-delay:2.4s">2024</text>
        <text x="220" y="330" class="sub" style="animation-delay:2.4s">YGR Global IT</text>
    </g>

    <!-- 2025 -->
    <g class="node" onclick="showYear(2025)">
        <circle cx="680" cy="320" r="36" fill="var(--y2025)" style="animation-delay:2.4s"/>
        <text x="680" y="314" style="animation-delay:3s">2025</text>
        <text x="680" y="330" class="sub" style="animation-delay:3s">RR Talks</text>
    </g>

    <!-- 2026 -->
    <g class="node" onclick="showYear(2026)">
        <circle cx="750" cy="220" r="36" fill="var(--y2026)" style="animation-delay:3s"/>
        <text x="750" y="214" style="animation-delay:3.6s">2026</text>
        <text x="750" y="230" class="sub" style="animation-delay:3.6s">UpgradU & News</text>
    </g>

    <!-- Root -->
    <text x="450" y="610" text-anchor="middle"
          font-size="18" font-weight="bold" fill="#1f2933">
        RR Group
    </text>

</svg>

</div>

<script>
const data = {
    2023: `<h3>YGR Global Services</h3>
           <p>Started as overseas consultancy helping Indian students with global education and later growing into a software company in KPHB Hyderabad. Content can be long and scrollable if needed.</p>`,

    2024: `<h3>YGR Global IT Services Pvt Ltd</h3>
           <p>Expanded into Web, Mobile Apps, Digital Marketing, UI/UX, Testing, IT Support, and Internship programs for startups and enterprises. The content area adjusts height but remains close to the tree.</p>`,

    2025: `<h3>IT Trainings & Co-Working Spaces</h3>
           <p>Providing full stack training, workshops, and collaborative co-working spaces for startups and freelancers. This text can overflow and scroll inside the content box.</p>`,

    2026: `<h3>Expansion & Innovation</h3>
           <p>Building the Upgrade U App for productivity, analytics, operations, and collaboration. You can click any leaf to view details immediately below the tree with minimal gap.</p>`
};

function showYear(year) {
    const box = document.getElementById("yearContent");
    box.style.display = "block";
    box.innerHTML = data[year];
    box.scrollIntoView({behavior:"smooth", block:"start"});
}
</script>

</body>
</html>
