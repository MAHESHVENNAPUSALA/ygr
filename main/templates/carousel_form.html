{% extends "admin_base.html" %}

{% block title %}{{ title }}{% endblock %}
{% block header_title %}{{ title }}{% endblock %}

{% block content %}

<style>
/* ===== FORM CARD ===== */
.form-card {
    max-width: 700px;
    margin: 50px auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 25px 45px rgba(0,0,0,0.08);
}

/* ===== FORM TITLE ===== */
.form-card h4 {
    color: #092a49;
    text-align: center;
    margin-bottom: 30px;
    font-size: 26px;
    font-weight: 600;
}

/* ===== LABELS ===== */
label {
    font-weight: 600;
    color: #444;
    display: block;
    margin-bottom: 6px;
}

/* ===== INPUTS ===== */
input[type="text"],
input[type="file"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #dcdcdc;
    font-size: 14px;
    transition: all 0.3s ease;
}

input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37,99,235,0.15);
}

/* ===== SUBMIT BUTTON ===== */
button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border: none;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
}

button:hover {
    background: linear-gradient(135deg, #1d4ed8, #1e40af);
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(37,99,235,0.35);
}

/* ===== BACK LINK ===== */
.back-link {
    display: block;
    text-align: center;
    margin-top: 15px;
    text-decoration: none;
    color: #2563eb;
    font-weight: 600;
}

.back-link:hover {
    color: #1d4ed8;
    text-decoration: underline;
}

/* ===== MOBILE ===== */
@media (max-width: 600px) {
    .form-card {
        margin: 30px 15px;
        padding: 25px;
        border-radius: 14px;
    }

    .form-card h4 {
        font-size: 22px;
        margin-bottom: 25px;
    }

    input[type="text"],
    input[type="file"] {
        padding: 11px 12px;
        font-size: 14px;
    }

    button {
        padding: 11px;
        font-size: 14px;
    }
}
</style>

<div class="form-card">
    <h4>{{ title }}</h4>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label>Carousel Title</label>
            <input type="text"
                   name="carouseltitle"
                   class="form-control"
                   value="{{ carousel.carouseltitle|default:'' }}"
                   required>
        </div>

        <div class="mb-3">
            <label>Carousel Description</label>
            <input type="text"
                   name="carouselDesc"
                   class="form-control"
                   value="{{ carousel.carouselDesc|default:'' }}">
        </div>

        <div class="mb-3">
            <label>Carousel Image</label>
            <input type="file"
                   name="carouselImage"
                   class="form-control"
                   accept="image/*">
            {% if carousel %}
                <small class="text-muted">
                    Leave empty to keep existing image
                </small>
            {% endif %}
        </div>

        <button type="submit">Save</button>
    </form>

    <a href="{% url 'carousel_dashboard' %}" class="back-link">⬅ Back</a>
</div>

{% endblock %}
