{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Blogs | Best IT Company in India</title>
<meta name="keywords" content="IT Blogs, IT Company Blogs, Software Development Blogs, Technology Articles">

<link rel="icon" type="image/png" href="/static/images/logo.png"/>

<style>
/* ===== RESET ===== */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f7f8fa;
    max-width: 100%;
    overflow-x: hidden;
    color: #333;
}

a { text-decoration: none; color: inherit; }

/* ===== BLOG GRID ===== */
.blog-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
    max-width: 1500px;
    margin: 40px auto;
    padding: 0 15px;
}

.blog-card {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    transition: transform 0.3s, box-shadow 0.3s;
    min-height: 400px;
}

.blog-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.12);
}

.blog-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.blog-card .content {
    padding: 15px 20px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.blog-card h5 {
    font-size: 18px;
    color: #092a49;
    margin-bottom: 10px;
}

.blog-card p {
    font-size: 14px;
    line-height: 1.6;
    color: #555;
}

.read-more-btn {
    color: #007BFF;
    cursor: pointer;
    font-weight: 500;
    margin-top: 8px;
    font-size: 14px;
    display: inline-block;
}

.read-more-btn:hover {
    text-decoration: underline;
}

.head{
    text-align:center;
    color:#092a49; 
    margin-top:40px; 
    margin-bottom:30px;
}

@media (max-width: 992px) {
    .blog-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .blog-container {
        grid-template-columns: 1fr;
    }

    .blog-card img {
        height: 180px;
    }
}
</style>
</head>

<body>

{% include "header.html" %}

<h1 class="head">Our Blogs</h1>

<section class="blog-section">
<div class="blog-container">

{% for blog in blogs %}
<div class="blog-card">
    <img src="{{ blog.image.url }}" alt="{{ blog.title }}">
    
    <div class="content">
        <h5>{{ blog.title }}</h5>

        <p class="blog-short">
            {{ blog.description|truncatewords:30 }}
        </p>

        <a href="{% url 'blog_detail' blog.id %}" class="read-more-btn">
            Read More →
        </a>

    </div>
</div>

{% empty %}
<p>No blogs available.</p>
{% endfor %}

</div>
</section>



{% include "footer.html" %}

</body>
</html>
